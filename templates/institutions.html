{% extends "base.html" %}

{% block content %}

<h2 class="text-2xl font-bold text-slate-900 mb-6 tracking-tight">Institutions</h2>

<a class="btn btn-success mb-3" href="/institutions/add">
Add Institution
</a>

<div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 mb-6"><table class="w-full text-left border-collapse text-sm">

<thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">

<tr class="hover:bg-slate-50 transition-colors">

<th class="px-6 py-4">Name</th>
<th class="px-6 py-4">Type</th>
<th class="px-6 py-4">City</th>
<th class="px-6 py-4">Contact Person</th>
<th class="px-6 py-4">Phone</th>

</tr>

</thead>

<tbody class="divide-y divide-slate-100 text-slate-700">

{% for i in institutions %}

<tr class="hover:bg-slate-50 transition-colors">

<td class="px-6 py-4">{{ i.name }}</td>
<td class="px-6 py-4">{{ i.type }}</td>
<td class="px-6 py-4">{{ i.city }}</td>
<td class="px-6 py-4">{{ i.contact_person }}</td>
<td class="px-6 py-4">{{ i.contact_phone }}</td>

</tr>

{% endfor %}

</tbody>

</table></div>

{% endblock %}
