{% extends "base.html" %}

{% block content %}

<h2>Institutions</h2>

<a class="btn btn-success mb-3" href="/institutions/add">
Add Institution
</a>

<table class="table table-striped">

<thead>

<tr>

<th>Name</th>
<th>Type</th>
<th>City</th>
<th>Contact Person</th>
<th>Phone</th>

</tr>

</thead>

<tbody>

{% for i in institutions %}

<tr>

<td>{{ i.name }}</td>
<td>{{ i.type }}</td>
<td>{{ i.city }}</td>
<td>{{ i.contact_person }}</td>
<td>{{ i.contact_phone }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
