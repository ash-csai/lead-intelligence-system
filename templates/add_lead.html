{% extends "base.html" %}

{% block content %}

<h2 class="text-2xl font-bold text-slate-900 mb-6 tracking-tight">Add Lead</h2>

<form method="POST">

<div class="mb-3">
<label>Student Name</label>
<input type="text" name="student_name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors">
</div>

<div class="mb-3">
<label>City</label>
<input type="text" name="city" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors">
</div>

<div class="mb-2">
<label>School</label>
<select class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" name="school_id">
<option value="">Select School</option>
{% for s in schools %}
<option value="{{ s.institution_id }}">
{{ s.name }}
</option>
{% endfor %}
</select>
</div>

<div class="mb-2">
<label>Coaching Centre</label>
<select class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" name="coaching_id">
<option value="">Select Coaching</option>
{% for c in coachings %}
<option value="{{ c.institution_id }}">
{{ c.name }}
</option>
{% endfor %}
</select>
</div>

<div class="mb-3">
<label>Course Interest</label>
<input type="text" name="course_interest" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors">
</div>

<div class="mb-3">
<label>Lead Source</label>
<select name="lead_source" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors">
<option value="">Select source</option>
<option value="Website">Website</option>
<option value="Referral">Referral</option>
<option value="Walk-in">Walk-in</option>
<option value="Social Media">Social Media</option>
<option value="Advertisement">Advertisement</option>
<option value="Other">Other</option>
</select>
</div>

<div class="mb-3">
<label>Interest Level</label>

<select name="interest_level" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors">

<option value="High">High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>

</select>

</div>

<div class="mb-3">
<label>Notes</label>
<textarea name="notes" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors"></textarea>
</div>

<button class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors text-sm">
Add Lead
</button>

</form>

{% endblock %}
