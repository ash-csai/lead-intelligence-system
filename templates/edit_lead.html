{% extends "base.html" %}

{% block content %}

<h2 class="text-2xl font-bold text-slate-900 mb-6 tracking-tight">Edit Lead</h2>

<form method="POST">

<div class="mb-2">
<label>Name</label>
<input name="student_name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" value="{{ lead.student_name }}">
</div>

<div class="mb-2">
<label>Phone</label>
<input name="phone" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" value="{{ lead.phone }}">
</div>

<div class="mb-2">
<label>City</label>
<input name="city" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" value="{{ lead.city }}">
</div>

<div class="mb-2">
<label>Course</label>
<input name="course_interest" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" value="{{ lead.course_interest }}">
</div>

<div class="mb-2">
<label>Interest Level</label>
<input name="interest_level" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors" value="{{ lead.interest_level }}">
</div>

<div class="mb-2">
<label>Notes</label>
<textarea name="notes" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white transition-colors">{{ lead.notes }}</textarea>
</div>

<button class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors text-sm">Update</button>

</form>

{% endblock %}
