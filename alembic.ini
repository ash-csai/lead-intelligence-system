# Alembic configuration file
# See the documentation for more options at:
# http://alembic.sqlalchemy.org

# This is the main configuration object for Alembic.
[alembic]
sqlalchemy.url = sqlite:///lead_system.db
script_location = alembic
migration_file_template = %%(rev)s_%%(slug)s.py
file_template = %%(file)s

# Logging configuration
[loggers]
keys = root,sqlalchemy.pool,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.pool]
level = WARN
handlers =
qualname = sqlalchemy.pool

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
